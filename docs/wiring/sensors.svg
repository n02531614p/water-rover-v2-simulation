.mot{fill:#f6e7a8;stroke:#2b3440;stroke-width:1.6}.pump{fill:#dbe9f6;stroke:#2b3440;stroke-width:1.6}.x{stroke:#c0392b;stroke-width:2}
</style><rect width="1000" height="470" class="paper"/><rect x="110" y="70" width="170" height="150" rx="6" class="box"/><text x="195.0" y="90" class="t" text-anchor="middle">SG90 servo</text><text x="195.0" y="106" class="s" text-anchor="middle">delivery arm (#6)</text><circle cx="110" cy="126" r="3.5" class="pin"/><text x="118" y="130" class="p" text-anchor="start">orange</text><circle cx="110" cy="160" r="3.5" class="pin"/><text x="118" y="164" class="p" text-anchor="start">red</text><circle cx="110" cy="194" r="3.5" class="pin"/><text x="118" y="198" class="p" text-anchor="start">brown</text><polyline points="110,126 60,126" class="w ws"/><text x="54" y="130" class="p" text-anchor="end">GPIO13</text><polyline points="110,160 60,160" class="w w5"/><text x="54" y="164" class="p" text-anchor="end">5 V</text><polyline points="110,194 60,194" class="w wg"/><text x="54" y="198" class="p" text-anchor="end">GND</text><circle cx="85" cy="160" r="4" class="dot"/><circle cx="95" cy="194" r="4" class="dot"/><polyline points="85,160 85,250" class="w w5"/><line x1="85" y1="250" x2="85" y2="259" class="sym"/><line x1="75" y1="259" x2="95" y2="259" class="sym"/><line x1="75" y1="265" x2="95" y2="265" class="sym"/><line x1="85" y1="265" x2="85" y2="274" class="sym"/><text x="98" y="258" class="p" text-anchor="start">+</text><text x="99" y="270" class="p" text-anchor="start">100 uF</text><polyline points="85,274 85,290 95,290 95,194" class="w wg"/><text x="110" y="320" class="s" text-anchor="start">100 uF across the servo leads, close to it</text><rect x="340" y="70" width="200" height="150" rx="6" class="box"/><text x="440.0" y="90" class="t" text-anchor="middle">Water-flow sensor</text><text x="440.0" y="106" class="s" text-anchor="middle">intake hose (#1, #5)</text><circle cx="540" cy="126" r="3.5" class="pin"/><text x="532" y="130" class="p" text-anchor="end">red</text><circle cx="540" cy="160" r="3.5" class="pin"/><text x="532" y="164" class="p" text-anchor="end">black</text><circle cx="540" cy="194" r="3.5" class="pin"/><text x="532" y="198" class="p" text-anchor="end">yellow</text><polyline points="540,126 600,126" class="w w5"/><text x="606" y="130" class="p" text-anchor="start">5 V</text><polyline points="540,160 600,160" class="w wg"/><text x="606" y="164" class="p" text-anchor="start">GND</text><polyline points="540,194 580,194 580,220" class="w wf"/><polyline points="580,220 580,226 586,229.0 574,232.5 586,236.0 574,239.5 586,243.0 580,246 580,252" class="sym"/><text x="592" y="240" class="p" text-anchor="start">10k</text><polyline points="580,252 580,280" class="w wf"/><circle cx="580" cy="280" r="4" class="dot"/><polyline points="580,280 580,286 586,289.0 574,292.5 586,296.0 574,299.5 586,303.0 580,306 580,312" class="sym"/><text x="592" y="300" class="p" text-anchor="start">20k</text><polyline points="580,312 580,330" class="w wg"/><line x1="580" y1="330" x2="580" y2="338" class="w wg"/><line x1="570" y1="338" x2="590" y2="338" class="sym"/><line x1="574" y1="342" x2="586" y2="342" class="sym"/><line x1="578" y1="346" x2="582" y2="346" class="sym"/><polyline points="580,280 650,280" class="w wf"/><text x="656" y="284" class="p" text-anchor="start">GPIO34</text><text x="340" y="380" class="n" text-anchor="start">5 V pulses -> 3.3 V: 10k / 20k divider.</text><text x="340" y="400" class="n" text-anchor="start">Fit it after the pre-filter, arrow in the flow direction.</text><text x="830" y="90" class="t" text-anchor="middle">Battery / 5 V rail sense (#10)</text><polyline points="830,110 830,140" class="w w5"/><text x="838" y="124" class="p" text-anchor="start">5 V rail</text><polyline points="830,140 830,146 836,149.0 824,152.5 836,156.0 824,159.5 836,163.0 830,166 830,172" class="sym"/><text x="842" y="160" class="p" text-anchor="start">10k</text><polyline points="830,172 830,200" class="w wa"/><circle cx="830" cy="200" r="4" class="dot"/><polyline points="830,200 830,206 836,209.0 824,212.5 836,216.0 824,219.5 836,223.0 830,226 830,232" class="sym"/><text x="842" y="220" class="p" text-anchor="start">10k</text><polyline points="830,232 830,260" class="w wg"/><line x1="830" y1="260" x2="830" y2="268" class="w wg"/><line x1="820" y1="268" x2="840" y2="268" class="sym"/><line x1="824" y1="272" x2="836" y2="272" class="sym"/><line x1="828" y1="276" x2="832" y2="276" class="sym"/><polyline points="830,200 900,200" class="w wa"/><text x="906" y="204" class="p" text-anchor="start">GPIO39</text><polyline points="870,200 870,222" class="w wa"/><circle cx="870" cy="200" r="4" class="dot"/><line x1="870" y1="222" x2="870" y2="231" class="sym"/><line x1="860" y1="231" x2="880" y2="231" class="sym"/><line x1="860" y1="237" x2="880" y2="237" class="sym"/><line x1="870" y1="237" x2="870" y2="246" class="sym"/><text x="884" y="242" class="p" text-anchor="start">100 nF</text><polyline points="870,246 870,260 830,260" class="w wg"/><text x="740" y="320" class="n" text-anchor="start">GPIO39 reads half the rail voltage.</text><text x="740" y="340" class="n" text-anchor="start">Set VCAL from a multimeter reading.</text></svg>
