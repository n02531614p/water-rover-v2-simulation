<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-label="Power distribution"><title>Power distribution</title><style>
.paper{fill:#fbfaf6}.box{fill:#ffffff;stroke:#2b3440;stroke-width:1.6}.box2{fill:#eef3f7;stroke:#2b3440;stroke-width:1.6}
.t{font:600 15px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;fill:#1d2530}.s{font:12px 'Source Sans 3',Arial,sans-serif;fill:#5b6573}
.p{font:500 11px 'JetBrains Mono',Consolas,monospace;fill:#1d2530}.n{font:600 11px 'Source Sans 3',Arial,sans-serif;fill:#9a3412}
.w{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.bus{stroke-width:6}
.w5{stroke:#d62828}.wg{stroke:#1f2328}.w33{stroke:#f08c00}.wp{stroke:#7b3fbf}.wd{stroke:#1c64d1}.wr{stroke:#0f9488}
.ws{stroke:#d9a400}.wf{stroke:#2f9e44}.wm{stroke:#8b5a2b}.wa{stroke:#7a8494}
.dot{fill:#1d2530}.pin{fill:#ffffff;stroke:#2b3440;stroke-width:1.3}.sym{fill:none;stroke:#1d2530;stroke-width:1.8}
.mot{fill:#f6e7a8;stroke:#2b3440;stroke-width:1.6}.pump{fill:#dbe9f6;stroke:#2b3440;stroke-width:1.6}.x{stroke:#c0392b;stroke-width:2}
</style><rect width="1060" height="560" class="paper"/><rect x="20" y="150" width="190" height="170" rx="6" class="box"/><text x="115.0" y="170" class="t" text-anchor="middle">Power bank 10,000 mAh</text><text x="115.0" y="186" class="s" text-anchor="middle">5 V USB</text><circle cx="210" cy="210" r="3.5" class="pin"/><text x="202" y="214" class="p" text-anchor="end">USB #1</text><circle cx="210" cy="250" r="3.5" class="pin"/><text x="202" y="254" class="p" text-anchor="end">USB #2</text><circle cx="210" cy="290" r="3.5" class="pin"/><text x="202" y="294" class="p" text-anchor="end">GND</text><rect x="330" y="30" width="190" height="120" rx="6" class="box"/><text x="425.0" y="50" class="t" text-anchor="middle">ESP32 DevKit V1</text><text x="425.0" y="66" class="s" text-anchor="middle">logic only</text><circle cx="330" cy="80" r="3.5" class="pin"/><text x="338" y="84" class="p" text-anchor="start">USB</text><circle cx="520" cy="80" r="3.5" class="pin"/><text x="512" y="84" class="p" text-anchor="end">3V3</text><circle cx="520" cy="104" r="3.5" class="pin"/><text x="512" y="108" class="p" text-anchor="end">GND</text><circle cx="520" cy="128" r="3.5" class="pin"/><text x="512" y="132" class="p" text-anchor="end">GPIO39</text><polyline points="210,210 260,210 260,80 330,80" class="w w5"/><text x="268" y="150" class="s" text-anchor="start">USB cable</text><polyline points="210,250 960,250" class="w w5 bus"/><text x="340" y="240" class="t" text-anchor="middle">5 V RAIL</text><polyline points="210,290 960,290" class="w wg bus"/><text x="340" y="312" class="t" text-anchor="middle">COMMON GND</text><polyline points="520,104 560,104 560,290" class="w wg"/><circle cx="560" cy="290" r="4" class="dot"/><text x="568" y="200" class="n" text-anchor="start">ESP32 GND joins the GND bus</text><polyline points="250,250 250,380" class="w w5"/><polyline points="290,290 290,380" class="w wg"/><circle cx="250" cy="250" r="4" class="dot"/><circle cx="290" cy="290" r="4" class="dot"/><rect x="220" y="380" width="110" height="70" rx="6" class="box"/><text x="275.0" y="400" class="t" text-anchor="middle">L298N</text><text x="275.0" y="416" class="s" text-anchor="middle">+12V (Vs) and +5V</text><polyline points="390,250 390,380" class="w w5"/><polyline points="430,290 430,380" class="w wg"/><circle cx="390" cy="250" r="4" class="dot"/><circle cx="430" cy="290" r="4" class="dot"/><rect x="360" y="380" width="110" height="70" rx="6" class="box"/><text x="415.0" y="400" class="t" text-anchor="middle">Relay A+B</text><text x="415.0" y="416" class="s" text-anchor="middle">RY-VCC + 4 COM</text><polyline points="530,250 530,380" class="w w5"/><polyline points="570,290 570,380" class="w wg"/><circle cx="530" cy="250" r="4" class="dot"/><circle cx="570" cy="290" r="4" class="dot"/><rect x="500" y="380" width="110" height="70" rx="6" class="box"/><text x="555.0" y="400" class="t" text-anchor="middle">SG90 servo</text><text x="555.0" y="416" class="s" text-anchor="middle">red / brown</text><polyline points="670,250 670,380" class="w w5"/><polyline points="710,290 710,380" class="w wg"/><circle cx="670" cy="250" r="4" class="dot"/><circle cx="710" cy="290" r="4" class="dot"/><rect x="640" y="380" width="110" height="70" rx="6" class="box"/><text x="695.0" y="400" class="t" text-anchor="middle">Flow sensor</text><text x="695.0" y="416" class="s" text-anchor="middle">red / black</text><polyline points="820,250 820,360" class="w w5"/><circle cx="820" cy="250" r="4" class="dot"/><line x1="820" y1="360" x2="820" y2="369" class="sym"/><line x1="810" y1="369" x2="830" y2="369" class="sym"/><line x1="810" y1="375" x2="830" y2="375" class="sym"/><line x1="820" y1="375" x2="820" y2="384" class="sym"/><text x="833" y="368" class="p" text-anchor="start">+</text><text x="834" y="380" class="p" text-anchor="start">1000 uF</text><polyline points="820,384 820,470" class="w wg"/><polyline points="860,290 860,470 820,470" class="w wg"/><circle cx="860" cy="290" r="4" class="dot"/><text x="840" y="500" class="s" text-anchor="middle">1000 uF across the rail</text><polyline points="900,250 900,330" class="w w5"/><circle cx="900" cy="250" r="4" class="dot"/><polyline points="900,330 900,336 906,339.0 894,342.5 906,346.0 894,349.5 906,353.0 900,356 900,362" class="sym"/><text x="912" y="350" class="p" text-anchor="start">10k</text><polyline points="900,362 900,380" class="w wa"/><circle cx="900" cy="380" r="4" class="dot"/><polyline points="900,380 900,386 906,389.0 894,392.5 906,396.0 894,399.5 906,403.0 900,406 900,412" class="sym"/><text x="912" y="400" class="p" text-anchor="start">10k</text><polyline points="900,412 900,440" class="w wg"/><line x1="900" y1="440" x2="900" y2="448" class="w wg"/><line x1="890" y1="448" x2="910" y2="448" class="sym"/><line x1="894" y1="452" x2="906" y2="452" class="sym"/><line x1="898" y1="456" x2="902" y2="456" class="sym"/><polyline points="900,380 940,380 940,160 600,160 600,128 520,128" class="w wa"/><text x="960" y="404" class="s" text-anchor="start">battery sense</text><text x="960" y="420" class="s" text-anchor="start">(optional,</text><text x="960" y="436" class="s" text-anchor="start">see sheet 4)</text><text x="30" y="520" class="n" text-anchor="start">Two USB outputs isolate the ESP32 from motor inrush. Single-output bank: feed the ESP32 from the rail and keep the 1000 uF cap.</text></svg>
