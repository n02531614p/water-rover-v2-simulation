/><text x="562" y="504" class="p" text-anchor="end">K1 COM</text><text x="562" y="530" class="p" text-anchor="end">K1 NO</text><polyline points="570,500 720,500" class="w w5"/><circle cx="720" cy="500" r="4" class="dot"/><rect x="780" y="486" width="140" height="64" rx="8" class="pump"/><text x="850" y="512" class="t" text-anchor="middle">CHLORINE PUMP</text><text x="850" y="530" class="s" text-anchor="middle">CH3 . Issue #3</text><polyline points="570,526 755,526 755,504 780,504" class="w wm"/><text x="774" y="498" class="p" text-anchor="end">+</text><polyline points="920,532 960,532" class="w wg"/><circle cx="960" cy="532" r="4" class="dot"/><text x="926" y="526" class="p" text-anchor="start">-</text><circle cx="755" cy="526" r="4" class="dot"/><polyline points="755,526 755,540" class="w wm"/><line x1="755" y1="540" x2="755" y2="551.0" class="sym"/><line x1="755" y1="565.0" x2="755" y2="576" class="sym"/><polygon points="748,565.0 762,565.0 755,552.0" class="sym"/><line x1="748" y1="551.0" x2="762" y2="551.0" class="sym"/><polyline points="755,576 755,584 940,584 940,532" class="w wg"/><circle cx="940" cy="532" r="4" class="dot"/><circle cx="570" cy="610" r="3.5" class="pin"/><circle cx="570" cy="636" r="3.5" class="pin"/><text x="562" y="614" class="p" text-anchor="end">K2 COM</text><text x="562" y="640" class="p" text-anchor="end">K2 NO</text><polyline points="570,610 720,610" class="w w5"/><circle cx="720" cy="610" r="4" class="dot"/><rect x="780" y="596" width="140" height="64" rx="8" class="pump"/><text x="850" y="622" class="t" text-anchor="middle">DELIVERY PUMP</text><text x="850" y="640" class="s" text-anchor="middle">CH4 . Issue #8</text><polyline points="570,636 755,636 755,614 780,614" class="w wm"/><text x="774" y="608" class="p" text-anchor="end">+</text><polyline points="920,642 960,642" class="w wg"/><circle cx="960" cy="642" r="4" class="dot"/><text x="926" y="636" class="p" text-anchor="start">-</text><circle cx="755" cy="636" r="4" class="dot"/><polyline points="755,636 755,650" class="w wm"/><line x1="755" y1="650" x2="755" y2="661.0" class="sym"/><line x1="755" y1="675.0" x2="755" y2="686" class="sym"/><polygon points="748,675.0 762,675.0 755,662.0" class="sym"/><line x1="748" y1="661.0" x2="762" y2="661.0" class="sym"/><polyline points="755,686 755,694 940,694 940,642" class="w wg"/><circle cx="940" cy="642" r="4" class="dot"/><line x1="33" y1="633" x2="47" y2="647" class="x"/><line x1="33" y1="647" x2="47" y2="633" class="x"/><text x="51" y="644" class="n" text-anchor="start">BOTH boards: remove the JD-VCC jumper</text><text x="30" y="668" class="n" text-anchor="start">JD-VCC (+ the GND beside it) to the 5 V rail,</text><text x="30" y="686" class="n" text-anchor="start">VCC to ESP32 3V3: the 3.3 V GPIOs then</text><text x="30" y="704" class="n" text-anchor="start">drive the opto-couplers.</text><text x="30" y="740" class="n" text-anchor="start">Board A: IN1 = CH1 intake, IN2 = CH2 transfer.</text><text x="30" y="758" class="n" text-anchor="start">Board B: IN1 = CH3 chlorine, IN2 = CH4 delivery.</text><text x="30" y="794" class="n" text-anchor="start">Flyback diode across each pump, stripe to +.</text><text x="30" y="812" class="n" text-anchor="start">Use the NO and COM screws; leave NC empty.</text></svg>
