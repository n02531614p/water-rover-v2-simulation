<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Drive: ESP32 to L298N to four TT motors"><title>Drive: ESP32 to L298N to four TT motors</title><style>
.paper{fill:#fbfaf6}.box{fill:#ffffff;stroke:#2b3440;stroke-width:1.6}.box2{fill:#eef3f7;stroke:#2b3440;stroke-width:1.6}
.t{font:600 15px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;fill:#1d2530}.s{font:12px 'Source Sans 3',Arial,sans-serif;fill:#5b6573}
.p{font:500 11px 'JetBrains Mono',Consolas,monospace;fill:#1d2530}.n{font:600 11px 'Source Sans 3',Arial,sans-serif;fill:#9a3412}
.w{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.bus{stroke-width:6}
.w5{stroke:#d62828}.wg{stroke:#1f2328}.w33{stroke:#f08c00}.wp{stroke:#7b3fbf}.wd{stroke:#1c64d1}.wr{stroke:#0f9488}
.ws{stroke:#d9a400}.wf{stroke:#2f9e44}.wm{stroke:#8b5a2b}.wa{stroke:#7a8494}
.dot{fill:#1d2530}.pin{fill:#ffffff;stroke:#2b3440;stroke-width:1.3}.sym{fill:none;stroke:#1d2530;stroke-width:1.8}
.mot{fill:#f6e7a8;stroke:#2b3440;stroke-width:1.6}.pump{fill:#dbe9f6;stroke:#2b3440;stroke-width:1.6}.x{stroke:#c0392b;stroke-width:2}
</style><rect width="1000" height="520" class="paper"/><rect x="30" y="90" width="170" height="300" rx="6" class="box"/><text x="115.0" y="110" class="t" text-anchor="middle">ESP32</text><text x="115.0" y="126" class="s" text-anchor="middle">rover_pins.h</text><circle cx="200" cy="150" r="3.5" class="pin"/><text x="192" y="154" class="p" text-anchor="end">GPIO14</text><circle cx="200" cy="182" r="3.5" class="pin"/><text x="192" y="186" class="p" text-anchor="end">GPIO27</text><circle cx="200" cy="214" r="3.5" class="pin"/><text x="192" y="218" class="p" text-anchor="end">GPIO26</text><circle cx="200" cy="246" r="3.5" class="pin"/><text x="192" y="250" class="p" text-anchor="end">GPIO25</text><circle cx="200" cy="278" r="3.5" class="pin"/><text x="192" y="282" class="p" text-anchor="end">GPIO33</text><circle cx="200" cy="310" r="3.5" class="pin"/><text x="192" y="314" class="p" text-anchor="end">GPIO32</text><circle cx="200" cy="342" r="3.5" class="pin"/><text x="192" y="346" class="p" text-anchor="end">GND</text><rect x="400" y="90" width="190" height="300" rx="6" class="box"/><text x="495.0" y="110" class="t" text-anchor="middle">L298N</text><text x="495.0" y="126" class="s" text-anchor="middle">dual H-bridge</text><circle cx="400" cy="150" r="3.5" class="pin"/><text x="408" y="154" class="p" text-anchor="start">ENA</text><circle cx="400" cy="182" r="3.5" class="pin"/><text x="408" y="186" class="p" text-anchor="start">IN1</text><circle cx="400" cy="214" r="3.5" class="pin"/><text x="408" y="218" class="p" text-anchor="start">IN2</text><circle cx="400" cy="246" r="3.5" class="pin"/><text x="408" y="250" class="p" text-anchor="start">IN3</text><circle cx="400" cy="278" r="3.5" class="pin"/><text x="408" y="282" class="p" text-anchor="start">IN4</text><circle cx="400" cy="310" r="3.5" class="pin"/><text x="408" y="314" class="p" text-anchor="start">ENB</text><circle cx="400" cy="342" r="3.5" class="pin"/><text x="408" y="346" class="p" text-anchor="start">GND</text><circle cx="590" cy="150" r="3.5" class="pin"/><text x="582" y="154" class="p" text-anchor="end">OUT1</text><circle cx="590" cy="182" r="3.5" class="pin"/><text x="582" y="186" class="p" text-anchor="end">OUT2</text><circle cx="590" cy="214" r="3.5" class="pin"/><text x="582" y="218" class="p" text-anchor="end">OUT3</text><circle cx="590" cy="246" r="3.5" class="pin"/><text x="582" y="250" class="p" text-anchor="end">OUT4</text><polyline points="200,150 400,150" class="w wp"/><polyline points="200,182 400,182" class="w wd"/><polyline points="200,214 400,214" class="w wd"/><polyline points="200,246 400,246" class="w wd"/><polyline points="200,278 400,278" class="w wd"/><polyline points="200,310 400,310" class="w wp"/><polyline points="200,342 400,342" class="w wg"/><text x="300" y="140" class="s" text-anchor="middle">PWM left</text><text x="300" y="302" class="s" text-anchor="middle">PWM right</text><circle cx="440" cy="90" r="3.5" class="pin"/><circle cx="500" cy="90" r="3.5" class="pin"/><circle cx="560" cy="90" r="3.5" class="pin"/><text x="446" y="80" class="p" text-anchor="start">+12V</text><text x="506" y="80" class="p" text-anchor="start">+5V</text><text x="566" y="80" class="p" text-anchor="start">GND</text><polyline points="440,90 440,40 300,40" class="w w5"/><polyline points="500,90 500,40" class="w w5"/><circle cx="440" cy="40" r="4" class="dot"/><text x="296" y="44" class="s" text-anchor="end">5 V rail</text><polyline points="560,90 560,22 600,22" class="w wg"/><text x="604" y="26" class="s" text-anchor="start">GND bus</text><line x1="33" y1="433" x2="47" y2="447" class="x"/><line x1="33" y1="447" x2="47" y2="433" class="x"/><text x="51" y="444" class="n" text-anchor="start">remove the ENA and ENB jumpers (PWM comes from the ESP32)</text><line x1="33" y1="459" x2="47" y2="473" class="x"/><line x1="33" y1="473" x2="47" y2="459" class="x"/><text x="51" y="470" class="n" text-anchor="start">remove the 5V-EN jumper; feed +12V and +5V both from the rail</text><rect x="700" y="40" width="190" height="56" rx="10" class="mot"/><text x="795" y="64" class="t" text-anchor="middle">LEFT FRONT</text><text x="795" y="82" class="s" text-anchor="middle">TT geared motor</text><circle cx="700" cy="58" r="3.5" class="pin"/><circle cx="700" cy="80" r="3.5" class="pin"/><text x="694" y="62" class="p" text-anchor="end">a</text><text x="694" y="84" class="p" text-anchor="end">b</text><rect x="700" y="120" width="190" height="56" rx="10" class="mot"/><text x="795" y="144" class="t" text-anchor="middle">LEFT REAR</text><text x="795" y="162" class="s" text-anchor="middle">TT geared motor</text><circle cx="700" cy="138" r="3.5" class="pin"/><circle cx="700" cy="160" r="3.5" class="pin"/><text x="694" y="142" class="p" text-anchor="end">a</text><text x="694" y="164" class="p" text-anchor="end">b</text><rect x="700" y="240" width="190" height="56" rx="10" class="mot"/><text x="795" y="264" class="t" text-anchor="middle">RIGHT FRONT</text><text x="795" y="282" class="s" text-anchor="middle">TT geared motor</text><circle cx="700" cy="258" r="3.5" class="pin"/><circle cx="700" cy="280" r="3.5" class="pin"/><text x="694" y="262" class="p" text-anchor="end">a</text><text x="694" y="284" class="p" text-anchor="end">b</text><rect x="700" y="320" width="190" height="56" rx="10" class="mot"/><text x="795" y="344" class="t" text-anchor="middle">RIGHT REAR</text><text x="795" y="362" class="s" text-anchor="middle">TT geared motor</text><circle cx="700" cy="338" r="3.5" class="pin"/><circle cx="700" cy="360" r="3.5" class="pin"/><text x="694" y="342" class="p" text-anchor="end">a</text><text x="694" y="364" class="p" text-anchor="end">b</text><polyline points="590,150 625,150 625,58 700,58" class="w wm"/><polyline points="625,150 625,138 700,138" class="w wm"/><circle cx="625" cy="150" r="4" class="dot"/><polyline points="590,182 655,182 655,80 700,80" class="w wm"/><polyline points="655,182 655,160 700,160" class="w wm"/><circle cx="655" cy="182" r="4" class="dot"/><polyline points="590,214 625,214 625,258 700,258" class="w wm"/><polyline points="625,214 625,338 700,338" class="w wm"/><circle cx="625" cy="214" r="4" class="dot"/><polyline points="590,246 655,246 655,280 700,280" class="w wm"/><polyline points="655,246 655,360 700,360" class="w wm"/><circle cx="655" cy="246" r="4" class="dot"/><text x="700" y="410" class="n" text-anchor="start">Both motors on a side are in parallel.</text><text x="700" y="430" class="n" text-anchor="start">A side spins backwards? Swap its two leads.</text><text x="30" y="500" class="s" text-anchor="start">Dot = joined. Wires crossing without a dot are not connected.</text></svg>
