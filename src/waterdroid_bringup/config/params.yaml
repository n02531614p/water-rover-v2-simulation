# Waterdroid simulation parameters - values match the as-built hardware (docs/HARDWARE.md).
# Flow rates are realistic orders of magnitude; raise filter_flow_ml_s to speed up demos.

water_processor:
  ros__parameters:
    use_sim_time: true
    raw_tank_capacity_ml: 400.0       # Stage 1 transparent tank (max 400 mL)
    clean_tank_capacity_ml: 400.0     # Stage 3 transparent tank (max 400 mL)
    filter_column_capacity_ml: 100.0  # Stage 2 column head space
    intake_flow_ml_s: 20.0            # 5 V submersible pump with ~0.5 m lift
    filter_flow_ml_s: 10.0            # gravity column throughput (real sand/charcoal ~3 mL/s)
    column_drain_ml_s: 10.0
    delivery_flow_ml_s: 25.0          # 5 V delivery pump
    alum_pump_ml_s: 1.0               # peristaltic: 2 s = 2 mL (Issue #3)
    chlorine_pump_ml_s: 1.0
    alum_ml_per_litre: 3.0            # 1 % alum stock -> ~30 mg/L
    chlorine_ml_per_litre: 3.0        # 0.07 % NaOCl stock (bleach 1:50) -> ~2 mg/L
    max_single_dose_ml: 4.0
    alum_stock_ml: 250.0
    chlorine_stock_ml: 250.0
    intake_max_run_s: 90.0            # motor-burnout cutoff (Issue #1)
    dry_run_timeout_s: 3.0            # no water at the intake this long -> DRY_RUN fault
    raw_full_pct: 95.0
    clean_full_pct: 95.0
    column_high_pct: 90.0             # same thresholds as filtration_monitor-1.ino
    column_resume_pct: 50.0
    arm_deployed_deg: 80.0            # intake boom counts as lowered from here (Issue #1 / #6)
    river_min_x: 9.3                  # v2_village river bank at x = 10

arm_controller:
  ros__parameters:
    use_sim_time: true
    step_deg: 1.0                     # same interpolation as robotic_arm.ino
    step_period_s: 0.02

mission_navigator:
  ros__parameters:
    use_sim_time: true
    autostart: true
    river_stop_x: 9.6
    drive_speed: 0.35
    arrive_tolerance: 0.30
    pump_timeout_s: 120.0
    filter_timeout_s: 300.0
    chlorine_contact_s: 5.0           # shortened for simulation (real: 30 min)
    alum_ml_per_litre: 3.0
    raw_tank_capacity_ml: 380.0       # batch per trip (400 mL tanks)
    action_timeout_s: 60.0
    pose_source: ground_truth          # mission:=route switches this to dead_reckoning
    dr_speed_scale: 1.0                # dead-reckoning calibration (measured / commanded)
    dr_turn_scale: 1.0                 # set from a 5 s pivot test, like NAV_TURN_DPS on the rover

status_monitor:
  ros__parameters:
    use_sim_time: true
    mqtt_enabled: false               # true -> mirror onto the Node-RED MQTT topics
    mqtt_host: localhost
    mqtt_port: 1883
    battery_capacity_mah: 10000.0
    battery_usable_fraction: 0.85
    teleop_linear: 0.3
    teleop_angular: 1.5
